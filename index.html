<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Pudina Punch by Swasti</title>
    <style>
        :root {
            --yellow: #FCE473;
            --green: #228C46;
            --dark-green: #104A25;
            --white: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--yellow);
            color: var(--dark-green);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--white);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border: 4px solid var(--green);
        }
        h1 {
            text-align: center;
            color: var(--dark-green);
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid var(--green);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .summary {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
        .summary h2 {
            margin: 0;
            color: var(--dark-green);
        }
        .payment-section {
            display: none; /* Hidden until total is calculated */
            margin-top: 20px;
            text-align: center;
        }
        #qr-code {
            margin: 15px 0;
            width: 200px;
            height: 200px;
        }
        .btn {
            background-color: var(--green);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: var(--dark-green);
        }
        .btn-gpay {
            background-color: #104A25;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PUDINA PUNCH</h1>
    <p class="subtitle">Swasti Knows Best!</p>

    <form id="orderForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="phone">Phone Number (WhatsApp)</label>
        <input type="tel" id="phone" required>

        <label for="address">Full Delivery Address</label>
        <textarea id="address" rows="3" required></textarea>

        <label for="pin">PIN Code</label>
        <input type="number" id="pin" required placeholder="e.g., 400069">

        <label for="qty">Number of Bottles</label>
        <input type="number" id="qty" min="1" value="1" required>

        <div class="summary">
            <p id="calc-text">Total Amount: ₹0</p>
            <h2 id="total-display">₹0</h2>
        </div>

        <div id="payment-section" class="payment-section">
            <p>Scan to pay via any UPI App</p>
            <img id="qr-code" src="" alt="UPI QR Code">
            <p>- OR -</p>
            <a id="gpay-link" href="#" class="btn btn-gpay">Pay Now via UPI</a>
            
            <label for="screenshot">Upload Payment Screenshot (Required)</label>
            <input type="file" id="screenshot" accept="image/*" required>
        </div>

        <button type="submit" class="btn" id="submitBtn">Place Order</button>
    </form>
</div>

<script>
    // --- SETTINGS ---
    const UPI_ID = "darshana.mehta1956-1@okaxis"; 
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyy4vspB0cP5Wbz5dwHxODn0aPdfjNDrGWzkChFwn2cTT7xFZzy7TNuamVzxv9zlGfQsg/exec"; 

    const pinInput = document.getElementById('pin');
    const qtyInput = document.getElementById('qty');
    const totalDisplay = document.getElementById('total-display');
    const paymentSection = document.getElementById('payment-section');
    const qrCodeImg = document.getElementById('qr-code');
    const gpayLink = document.getElementById('gpay-link');
    const form = document.getElementById('orderForm');
    const submitBtn = document.getElementById('submitBtn');

    let currentTotal = 0;

    // Calculate total whenever PIN or Quantity changes
    function calculateAmount() {
        const pin = parseInt(pinInput.value);
        const qty = parseInt(qtyInput.value);

        if (isNaN(pin) || isNaN(qty) || pin.toString().length < 6) {
            paymentSection.style.display = 'none';
            totalDisplay.innerText = "₹0";
            return;
        }

        // Logic: Mumbai PIN codes are 400001 to 400104
        let pricePerBottle = 410; // Default outside Mumbai
        if (pin >= 400001 && pin <= 400104) {
            pricePerBottle = 360; // Mumbai price
        }

        currentTotal = pricePerBottle * qty;
        totalDisplay.innerText = `₹${currentTotal} (${qty} x ₹${pricePerBottle})`;

        // Generate UPI URL (works for GPay, PhonePe, Paytm)
        const upiString = `upi://pay?pa=${UPI_ID}&pn=Pudina%20Punch&am=${currentTotal}&cu=INR`;
        
        // Generate QR code image using a free public API
        qrCodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
        
        // Set deep link for mobile users
        gpayLink.href = upiString;

        paymentSection.style.display = 'block';
    }

    pinInput.addEventListener('input', calculateAmount);
    qtyInput.addEventListener('input', calculateAmount);

    // Handle Form Submission
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fileInput = document.getElementById('screenshot');
        if (fileInput.files.length === 0) {
            alert("Please upload a payment screenshot.");
            return;
        }

        submitBtn.innerText = "Processing Order...";
        submitBtn.disabled = true;

        const file = fileInput.files;
        const reader = new FileReader();

        reader.onload = async function() {
            // Get base64 string without the "data:image/jpeg;base64," prefix
            const base64Data = reader.result.split(',');
            
            const orderData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                pin: document.getElementById('pin').value,
                qty: document.getElementById('qty').value,
                total: currentTotal,
                mimetype: file.type,
                base64: base64Data
            };

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(orderData)
                });
                
                alert("Order placed successfully! Swasti thanks you.");
                form.reset();
                paymentSection.style.display = 'none';
                totalDisplay.innerText = "₹0";
            } catch (error) {
                alert("There was an error submitting your order. Please try again.");
                console.error(error);
            } finally {
                submitBtn.innerText = "Place Order";
                submitBtn.disabled = false;
            }
        };

        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
